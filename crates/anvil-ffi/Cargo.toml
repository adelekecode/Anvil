[package]
name = "anvil-ffi"
description = "C ABI bridge between anvil-core and host applications (Flutter via dart:ffi)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# staticlib for iOS (linked into the app binary), cdylib for Android (loaded as
# libanvil_ffi.so), rlib so Rust integration tests can link it directly.
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
crypto = ["anvil-core/crypto"]
quic = ["anvil-core/quic"]
opus = ["anvil-core/opus"]

[dependencies]
anvil-core.workspace = true
tracing.workspace = true
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[lints.rust]
missing_debug_implementations = "warn"
