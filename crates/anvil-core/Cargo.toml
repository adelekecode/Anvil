[package]
name = "anvil-core"
description = "Anvil protocol core: identity, rooms, crypto, media pipeline, transport selection, relay election."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Real cryptographic primitives. Off in Phase 0 so the scaffold builds bare;
# turn on in Phase 2.
crypto = ["dep:ed25519-dalek", "dep:x25519-dalek", "dep:chacha20poly1305", "dep:hkdf", "dep:sha2"]
# QUIC transport. Phase 1.
quic = ["dep:quinn", "dep:rustls"]
# Opus encode/decode. Requires a C toolchain for libopus. Phase 1.
opus = ["dep:audiopus"]
# Desktop audio I/O via CPAL + the capture/playback pipeline. Does not
# compile on Android / iOS; the real app uses its own native adapters.
desktop = ["dep:cpal", "opus"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true
rand_core.workspace = true
zeroize.workspace = true

ed25519-dalek = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
audiopus = { workspace = true, optional = true }
cpal = { version = "0.15", optional = true }

[lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"
